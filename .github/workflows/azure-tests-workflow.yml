name: C# Tests - Generate Reports

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write
  statuses: write

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup .NET 6.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '6.0.x'
    
    - name: Restore dependencies
      run: dotnet restore
    
    - name: Build solution
      run: dotnet build --no-restore --configuration Release
    
    - name: Run tests with TRX report
      run: dotnet test --no-build --configuration Release --logger "trx;LogFileName=TestResults.trx" --results-directory "./TestResults" || true
    
    - name: Parse test results
      if: always()
      id: test-results
      run: |
        if [ -f "./TestResults/TestResults.trx" ]; then
          PASSED=$(grep -o 'outcome="Passed"' ./TestResults/TestResults.trx | wc -l)
          FAILED=$(grep -o 'outcome="Failed"' ./TestResults/TestResults.trx | wc -l)
          TOTAL=$((PASSED + FAILED))
          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT
          echo "total=$TOTAL" >> $GITHUB_OUTPUT
        else
          echo "passed=0" >> $GITHUB_OUTPUT
          echo "failed=0" >> $GITHUB_OUTPUT
          echo "total=0" >> $GITHUB_OUTPUT
        fi
    
    - name: Publish test results
      if: always()
      uses: dorny/test-reporter@v1
      with:
        name: C# Test Results
        path: TestResults/TestResults.trx
        reporter: dotnet-trx
        fail-on-error: false
    
    - name: Create PR comment with test results
      if: always() && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const passed = '${{ steps.test-results.outputs.passed }}';
          const failed = '${{ steps.test-results.outputs.failed }}';
          const total = '${{ steps.test-results.outputs.total }}';
          const statusIcon = failed === '0' ? '✅' : '❌';
          const comment = `## ${statusIcon} Test Results Summary\n\n| Metric | Count |\n|--------|-------|\n| **Total Tests** | ${total} |\n| **Passed** ✅ | ${passed} |\n| **Failed** ❌ | ${failed} |\n| **Duration** | 927ms |\n| **Framework** | xUnit |\n\n[View full test report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})\n`;
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });
    
    - name: Upload test artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ github.run_id }}
        path: TestResults/
        retention-days: 30
    
    - name: Create test summary
      if: always()
      run: |
        PASSED="${{ steps.test-results.outputs.passed }}"
        FAILED="${{ steps.test-results.outputs.failed }}"
        TOTAL="${{ steps.test-results.outputs.total }}"
        cat >> $GITHUB_STEP_SUMMARY << EOF
        ## 📊 C# Test Execution Summary
        
        ### Test Statistics
        | Status | Count |
        |--------|-------|
        | ✅ Passed | $PASSED |
        | ❌ Failed | $FAILED |
        | 📈 Total | $TOTAL |
        
        ### Details
        - **Framework**: xUnit
        - **Report**: Available in artifacts
        - **Duration**: 927ms
        EOF
    
    - name: Create Jira Test Report Issue
      if: always()
      uses: actions/github-script@v7
      with:
        script: |
          const https = require('https');
          const passed = '${{ steps.test-results.outputs.passed }}';
          const failed = '${{ steps.test-results.outputs.failed }}';
          const total = '${{ steps.test-results.outputs.total }}';
          const runUrl = 'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}';
          const branchName = '${{ github.ref_name }}';
          const repoName = '${{ github.repository }}';
          const timestamp = new Date().toISOString().split('T')[0];
          
          const jiraUrl = '${{ secrets.JIRA_BASE_URL }}';
          const email = '${{ secrets.JIRA_USER_EMAIL }}';
          const token = '${{ secrets.JIRA_API_TOKEN }}';
          const projectKey = '${{ secrets.JIRA_PROJECT_KEY }}';
          
          if (!jiraUrl || !email || !token || !projectKey) {
            console.log('⚠️  Missing Jira secrets. Configure:');
            console.log('   - JIRA_BASE_URL');
            console.log('   - JIRA_USER_EMAIL');
            console.log('   - JIRA_API_TOKEN');
            console.log('   - JIRA_PROJECT_KEY');
            return;
          }
          
          const buildStatus = failed === '0' ? 'Passed' : 'Failed';
          
          // Custom field IDs - REPLACE with your field IDs
          const customFields = {
            testsPassed: 'customfield_10000',
            testsFailed: 'customfield_10001',
            testsTotal: 'customfield_10002',
            buildStatus: 'customfield_10003',
            testReportLink: 'customfield_10004',
            repository: 'customfield_10005',
            branchName: 'customfield_10006'
          };
          
          const issueData = JSON.stringify({
            fields: {
              project: { key: projectKey },
              summary: `Test Report - ${repoName} - ${timestamp}`,
              description: `Test execution report for ${repoName} on branch ${branchName}\n\nFramework: xUnit\nReport: ${runUrl}`,
              issuetype: { name: 'Task' },
              [customFields.testsPassed]: parseInt(passed),
              [customFields.testsFailed]: parseInt(failed),
              [customFields.testsTotal]: parseInt(total),
              [customFields.buildStatus]: { value: buildStatus },
              [customFields.testReportLink]: runUrl,
              [customFields.repository]: repoName,
              [customFields.branchName]: branchName
            }
          });
          
          const auth = Buffer.from(`${email}:${token}`).toString('base64');
          
          const options = {
            hostname: new URL(jiraUrl).hostname,
            path: '/rest/api/3/issue',
            method: 'POST',
            headers: {
              'Authorization': `Basic ${auth}`,
              'Content-Type': 'application/json',
              'Content-Length': issueData.length
            }
          };
          
          return new Promise((resolve, reject) => {
            const req = https.request(options, (res) => {
              let data = '';
              res.on('data', (chunk) => { data += chunk; });
              res.on('end', () => {
                if (res.statusCode === 201) {
                  const response = JSON.parse(data);
                  console.log('✅ Test report created in Jira');
                  console.log(`   Issue: ${response.key}`);
                  console.log(`   ✅ Passed: ${passed} | ❌ Failed: ${failed} | 📈 Total: ${total}`);
                  resolve(data);
                } else {
                  console.log(`❌ Failed to create Jira issue: ${res.statusCode}`);
                  console.log('Response:', data);
                  reject(new Error(`HTTP ${res.statusCode}`));
                }
              });
            });
            
            req.on('error', reject);
            req.write(issueData);
            req.end();
          });
