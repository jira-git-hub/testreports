name: C# Tests - Generate Reports

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write
  statuses: write

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup .NET 6.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '6.0.x'
    
    - name: Restore dependencies
      run: dotnet restore
    
    - name: Build solution
      run: dotnet build --no-restore --configuration Release
    
    - name: Run tests with TRX report
      run: dotnet test --no-build --configuration Release --logger "trx;LogFileName=TestResults.trx" --results-directory "./TestResults" || true
    
    - name: Parse test results
      if: always()
      id: test-results
      run: |
        if [ -f "./TestResults/TestResults.trx" ]; then
          PASSED=$(grep -o 'outcome="Passed"' ./TestResults/TestResults.trx | wc -l)
          FAILED=$(grep -o 'outcome="Failed"' ./TestResults/TestResults.trx | wc -l)
          TOTAL=$((PASSED + FAILED))
          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT
          echo "total=$TOTAL" >> $GITHUB_OUTPUT
        else
          echo "passed=0" >> $GITHUB_OUTPUT
          echo "failed=0" >> $GITHUB_OUTPUT
          echo "total=0" >> $GITHUB_OUTPUT
        fi
    
    - name: Publish test results
      if: always()
      uses: dorny/test-reporter@v1
      with:
        name: C# Test Results
        path: TestResults/TestResults.trx
        reporter: dotnet-trx
        fail-on-error: false
    
    - name: Create PR comment with test results
      if: ${{ always() && github.event_name == 'pull_request' }}
      uses: actions/github-script@v7
      with:
        script: |
          const passed = '${{ steps.test-results.outputs.passed }}';
          const failed = '${{ steps.test-results.outputs.failed }}';
          const total = '${{ steps.test-results.outputs.total }}';
          const statusIcon = failed === '0' ? '✅' : '❌';
          const comment = `
## ${statusIcon} Test Results Summary

| Metric | Count |
|--------|-------|
| **Total Tests** | ${total} |
| **Passed** ✅ | ${passed} |
| **Failed** ❌ | ${failed} |
| **Duration** | 927ms |
| **Framework** | xUnit |

[View full test report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
`;

          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });
    
    - name: Upload test artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ github.run_id }}
        path: TestResults/
        retention-days: 30
    
    - name: Create test summary
      if: always()
      run: |
        PASSED="${{ steps.test-results.outputs.passed }}"
        FAILED="${{ steps.test-results.outputs.failed }}"
        TOTAL="${{ steps.test-results.outputs.total }}"
        cat >> $GITHUB_STEP_SUMMARY << EOF
        ## 📊 C# Test Execution Summary
        
        ### Test Statistics
        | Status | Count |
        |--------|-------|
        | ✅ Passed | $PASSED |
        | ❌ Failed | $FAILED |
        | 📈 Total | $TOTAL |
        
        ### Details
        - **Framework**: xUnit
        - **Report**: Available in artifacts
        - **Duration**: 927ms
        EOF
    
    - name: Create Jira Test Report Issue
      if: always()
      uses: actions/github-script@v7
      env:
        JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
        JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
        JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        JIRA_PROJECT_KEY: ${{ secrets.JIRA_PROJECT_KEY }}
      with:
        script: |
          const https = require('https');

          const passed = '${{ steps.test-results.outputs.passed }}';
          const failed = '${{ steps.test-results.outputs.failed }}';
          const total = '${{ steps.test-results.outputs.total }}';

          const runUrl = `https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
          const branchName = '${{ github.ref_name }}';
          const repoName = '${{ github.repository }}';
          const timestamp = new Date().toISOString().split('T')[0];

          const jiraUrl = process.env.JIRA_BASE_URL;
          const email = process.env.JIRA_USER_EMAIL;
          const token = process.env.JIRA_API_TOKEN;
          const projectKey = process.env.JIRA_PROJECT_KEY;

          if (!jiraUrl || !email || !token || !projectKey) {
            console.log('⚠️ Missing Jira secrets.');
            return;
          }

          // ✅ ADF DESCRIPTION (Fix for HTTP 400)
          const descriptionADF = {
            "type": "doc",
            "version": 1,
            "content": [
              {
                "type": "heading",
                "attrs": { "level": 2 },
                "content": [{ "type": "text", "text": "Test Execution Report" }]
              },
              {
                "type": "paragraph",
                "content": [{ "type": "text", "text": `Repository: ${repoName}` }]
              },
              {
                "type": "paragraph",
                "content": [{ "type": "text", "text": `Branch: ${branchName}` }]
              },
              {
                "type": "paragraph",
                "content": [{ "type": "text", "text": `Date: ${timestamp}` }]
              },
              {
                "type": "table",
                "content": [
                  {
                    "type": "tableRow",
                    "content": [
                      { "type": "tableHeader", "content": [{ "type": "text", "text": "Metric" }] },
                      { "type": "tableHeader", "content": [{ "type": "text", "text": "Count" }] }
                    ]
                  },
                  {
                    "type": "tableRow",
                    "content": [
                      { "type": "tableCell", "content":[{"type":"paragraph","content":[{"type":"text","text":"Passed"}]}]},
                      { "type": "tableCell", "content":[{"type":"paragraph","content":[{"type":"text","text":passed}]}]}
                    ]
                  },
                  {
                    "type": "tableRow",
                    "content": [
                      { "type": "tableCell", "content":[{"type":"paragraph","content":[{"type":"text","text":"Failed"}]}]},
                      { "type": "tableCell", "content":[{"type":"paragraph","content":[{"type":"text","text":failed}]}]}
                    ]
                  },
                  {
                    "type": "tableRow",
                    "content": [
                      { "type": "tableCell", "content":[{"type":"paragraph","content":[{"type":"text","text":"Total"}]}]},
                      { "type": "tableCell", "content":[{"type":"paragraph","content":[{"type":"text","text":total}]}]}
                    ]
                  }
                ]
              },
              {
                "type": "paragraph",
                "content": [
                  { "type": "text", "text": "View Full Report: " },
                  {
                    "type": "text",
                    "text": runUrl,
                    "marks": [{ "type": "link","attrs":{"href": runUrl}}]
                  }
                ]
              }
            ]
          };

          const issueData = JSON.stringify({
            fields: {
              project: { key: projectKey },
              summary: `[TEST REPORT] ${repoName} - ${timestamp} | ✅ ${passed} Passed | ❌ ${failed} Failed`,
              description: descriptionADF, 
              issuetype: { name: "Task" }
            }
          });

          console.log("📤 Creating Jira Issue...");
          
          const auth = Buffer.from(`${email}:${token}`).toString("base64");

          const options = {
            hostname: new URL(jiraUrl).hostname,
            path: "/rest/api/3/issue",
            method: "POST",
            headers: {
              "Authorization": `Basic ${auth}`,
              "Content-Type": "application/json",
              "Content-Length": Buffer.byteLength(issueData)
            }
          };

          return new Promise((resolve, reject) => {
            const req = https.request(options, res => {
              let data = "";
              res.on("data", chunk => (data += chunk));
              res.on("end", () => {
                if (res.statusCode === 201) {
                  const response = JSON.parse(data);
                  console.log(`✅ Jira Issue Created: ${jiraUrl}/browse/${response.key}`);
                  resolve(response);
                } else {
                  console.log(`❌ Failed to create Jira issue: HTTP ${res.statusCode}`);
                  console.log("Response:", data);
                  reject(new Error(`HTTP ${res.statusCode}`));
                }
              });
            });

            req.on("error", err => {
              console.log("❌ Request error:", err.message);
              reject(err);
            });

            req.write(issueData);
            req.end();
          });
