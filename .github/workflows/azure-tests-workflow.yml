name: C# Tests - Xray Cloud Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    # --------------------------------------------------
    # Checkout & Setup
    # --------------------------------------------------
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET 6.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '6.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build solution
      run: dotnet build --configuration Release

    # --------------------------------------------------
    # Run xUnit tests and generate JUnit XML
    # --------------------------------------------------
    - name: Run tests with JUnit report
      run: |
        mkdir -p TestResults
        dotnet test \
          --no-build \
          --configuration Release \
          --logger "junit;LogFilePath=./TestResults/junit-results.xml" \
          || true

    # --------------------------------------------------
    # Upload results to Xray Cloud
    # --------------------------------------------------
    - name: Upload test results to Xray Cloud
      if: always()
      env:
        XRAY_CLIENT_ID: ${{ secrets.XRAY_CLIENT_ID }}
        XRAY_CLIENT_SECRET: ${{ secrets.XRAY_CLIENT_SECRET }}
      run: |
        echo "Authenticating with Xray Cloud..."

        AUTH_RESPONSE=$(curl -s -X POST \
          -H "Content-Type: application/json" \
          https://xray.cloud.getxray.app/api/v1/authenticate \
          -d '{
            "client_id": "'"$XRAY_CLIENT_ID"'",
            "client_secret": "'"$XRAY_CLIENT_SECRET"'"
          }')

        XRAY_TOKEN=$(echo "$AUTH_RESPONSE" | tr -d '"')

        if [ -z "$XRAY_TOKEN" ]; then
          echo "❌ Xray authentication failed"
          exit 1
        fi

        echo "✅ Authentication successful"

        if [ ! -f "./TestResults/junit-results.xml" ]; then
          echo "❌ JUnit results file not found. Skipping Xray upload."
          exit 0
        fi

        echo "✅ Uploading JUnit results to Xray Cloud..."
       
        curl -i -X POST \
          -H "Authorization: Bearer $XRAY_TOKEN" \
          -H "Content-Type: text/xml" \
          -H "Accept: application/json" \
          --data-binary @./TestResults/junit-results.xml \
          "https://xray.cloud.getxray.app/api/v2/import/execution/junit?projectKey=XSP&environment=CI"

