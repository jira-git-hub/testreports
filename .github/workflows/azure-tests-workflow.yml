name: C# Tests - Dashboard Only

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: write        # ✅ Required for GitHub Pages
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup .NET 6.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '6.0.x'
    
    - name: Restore dependencies
      run: dotnet restore
    
    - name: Build solution
      run: dotnet build --no-restore --configuration Release
    
    - name: Run tests with TRX report
      run: dotnet test --no-build --configuration Release --logger "trx;LogFileName=TestResults.trx" --results-directory "./TestResults" || true
    
    - name: Parse test results
      if: always()
      id: test-results
      run: |
        if [ -f "./TestResults/TestResults.trx" ]; then
          PASSED=$(grep -o 'outcome="Passed"' ./TestResults/TestResults.trx | wc -l)
          FAILED=$(grep -o 'outcome="Failed"' ./TestResults/TestResults.trx | wc -l)
          TOTAL=$((PASSED + FAILED))
        else
          PASSED=0
          FAILED=0
          TOTAL=0
        fi

        echo "passed=$PASSED" >> $GITHUB_OUTPUT
        echo "failed=$FAILED" >> $GITHUB_OUTPUT
        echo "total=$TOTAL" >> $GITHUB_OUTPUT
    
    - name: Export JSON for Jira Dashboard
      if: always()
      run: |
        mkdir -p dashboard

        PASSED="${{ steps.test-results.outputs.passed }}"
        FAILED="${{ steps.test-results.outputs.failed }}"
        TOTAL="${{ steps.test-results.outputs.total }}"
        RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

        cat > dashboard/dashboard-report.json << EOF
        {
          "repository": "${{ github.repository }}",
          "branch": "${{ github.ref_name }}",
          "passed": $PASSED,
          "failed": $FAILED,
          "total": $TOTAL,
          "timestamp": "$TIMESTAMP",
          "report_url": "$RUN_URL"
        }
        EOF
    
    - name: Upload test artifacts (optional)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ github.run_id }}
        path: TestResults/
        retention-days: 7

    - name: Deploy Dashboard JSON to GitHub Pages
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: dashboard
        branch: gh-pages
        clean: false
