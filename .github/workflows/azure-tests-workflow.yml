name: C# Tests - Generate Reports

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup .NET 6.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '6.0.x'
    
    - name: Restore dependencies
      run: dotnet restore
    
    - name: Build solution
      run: dotnet build --no-restore --configuration Release
    
    - name: Run tests and generate TRX report
      run: dotnet test --no-build --configuration Release --logger "trx;LogFileName=test-results.trx" --results-directory ./testresults
      continue-on-error: true
    
    - name: Install ReportGenerator
      run: dotnet tool install --global dotnet-reportgenerator-globaltool
    
    - name: Generate HTML Test Report
      if: always()
      run: reportgenerator -reports:"./testresults/**/*.trx" -targetdir:"./htmlreports" -reporttypes:"Html;HtmlSummary"
    
    - name: Publish test results
      if: always()
      uses: dorny/test-reporter@v1
      with:
        name: C# Test Results
        path: './testresults/**/*.trx'
        reporter: 'dotnet-trx'
        fail-on-error: false
    
    - name: Upload test artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: |
          ./testresults/**/*.trx
          ./htmlreports/**
        retention-days: 30
    
    - name: Create test summary
      if: always()
      run: |
        echo "## Test Execution Summary" >> $GITHUB_STEP_SUMMARY
        echo "✅ Tests completed and reports generated" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Report Details" >> $GITHUB_STEP_SUMMARY
        echo "- **Framework**: xUnit" >> $GITHUB_STEP_SUMMARY
        echo "- **Report Formats**: TRX, HTML" >> $GITHUB_STEP_SUMMARY
        echo "- **Artifacts**: Available for 30 days" >> $GITHUB_STEP_SUMMARY
